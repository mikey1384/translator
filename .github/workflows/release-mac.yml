name: Release – macOS (R2)

on:
  workflow_dispatch: # manual trigger for testing
  push:
    tags:
      - 'v*-mac' # Mac-only releases
      - 'v[0-9]+.[0-9]+.[0-9]+' # Full releases (both platforms) - pure SemVer only

permissions:
  contents: write

concurrency:
  # vX.Y.Z and vX.Y.Z-mac publish the same versioned object names. Serialize
  # every Mac release so those two tag forms can never mutate shared channels
  # concurrently; the upload gate below also rejects the alternate tag form.
  group: mac-release
  cancel-in-progress: false

jobs:
  mac-build:
    runs-on: macos-14 # Apple-silicon runner, Rosetta is available
    timeout-minutes: 60

    env:
      # ---------- Cloudflare R2 ----------
      R2_BUCKET: ai-translator-downloads
      R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # ---------- Apple codesign / notarise ----------
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ---------- GitHub ----------
      GH_TOKEN: ${{ github.token }}

      # ---------- youtube-dl-exec ----------
      YOUTUBE_DL_SKIP_DOWNLOAD: 'true'

    steps:
      # ————————————————————————————————————————————————————————————
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ---------- Node (no Bun) ----------
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Validate release identity and extract notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail

          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-mac)?$ ]]; then
            echo "::error::Unsupported macOS release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if [ "${BASH_REMATCH[1]}" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $APP_VERSION"
            exit 1
          fi

          TAG_TYPE=$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must be an annotated tag."
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse "$GITHUB_REF_NAME^{}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked-out commit $HEAD_COMMIT does not match $GITHUB_REF_NAME ($TAG_COMMIT)."
            exit 1
          fi

          BODY=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::Tag $GITHUB_REF_NAME annotation body is empty."
            echo "::error::Add release notes after a blank line in the tag annotation."
            exit 1
          fi

          printf '%s\n' "$BODY" > /tmp/release-notes.md

      # ---------- Apple signing cert ----------
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      # ---------- Install dependencies ----------
      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate release candidate
        run: |
          npm run lint
          npm test
          npm run security:dependencies

      # ---------- Rebuild native modules for both architectures ----------
      - name: Rebuild native modules for x64
        run: npm exec electron-builder install-app-deps -- --arch x64

      # ---------- Build both arm64 & x64 in one run ----------
      - name: Build both architectures
        run: npm run package:mac

      - name: Verify native payload architectures
        run: npm run verify:architectures

      - name: Verify signed apps, updater archives, and disk images
        run: |
          set -euo pipefail

          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          VERIFY_ROOT=$(mktemp -d)
          MOUNTED_DMG=""

          cleanup() {
            if [ -n "$MOUNTED_DMG" ]; then
              hdiutil detach "$MOUNTED_DMG" >/dev/null 2>&1 || true
            fi
            rm -rf "$VERIFY_ROOT"
          }
          trap cleanup EXIT

          verify_app() {
            local app_path="$1"
            echo "Verifying signed app: $app_path"
            codesign --verify --deep --strict --verbose=4 "$app_path" || return $?
            xcrun stapler validate "$app_path" || return $?
            spctl --assess --type execute --verbose=4 "$app_path" || return $?
          }

          verify_zip() {
            local arch="$1"
            local zip_path="dist/Translator-${APP_VERSION}-darwin-${arch}.zip"
            local extract_dir="$VERIFY_ROOT/$arch"

            if [ ! -f "$zip_path" ]; then
              echo "::error::Missing updater archive: $zip_path"
              exit 1
            fi

            mkdir -p "$extract_dir"
            ditto -x -k "$zip_path" "$extract_dir"
            verify_app "$extract_dir/Translator.app"
          }

          verify_dmg() {
            local arch="$1"
            local dmg_path="dist/Translator-${APP_VERSION}-darwin-${arch}.dmg"
            local mount_dir="$VERIFY_ROOT/dmg-${arch}"
            local app_status=0
            local detach_status=0

            if [ ! -f "$dmg_path" ]; then
              echo "::error::Missing disk image: $dmg_path"
              return 1
            fi

            hdiutil verify "$dmg_path"
            mkdir -p "$mount_dir"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg_path"
            MOUNTED_DMG="$mount_dir"

            verify_app "$mount_dir/Translator.app" || app_status=$?
            hdiutil detach "$mount_dir" || detach_status=$?
            MOUNTED_DMG=""

            if [ "$app_status" -ne 0 ]; then
              return "$app_status"
            fi
            return "$detach_status"
          }

          verify_app "dist/mac/Translator.app"
          verify_app "dist/mac-arm64/Translator.app"
          verify_zip x64
          verify_zip arm64
          verify_dmg x64
          verify_dmg arm64

      - name: Inject release notes into latest-mac.yml
        if: github.ref_type == 'tag'
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          node scripts/inject-update-release-notes.mjs \
            --yaml dist/latest-mac.yml \
            --version "$APP_VERSION" \
            --release-notes-file /tmp/release-notes.md

      # —————————————————————————————————— upload & release ——————————————————————————
      - name: Install AWS CLI v2
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          AWS_CLI_VERSION="2.36.29"
          AWS_CLI_SHA256="f2025d418e6d7e7aa2cd7ef237bd1b664522abe657c06172c2ded32bc1016ab9"
          curl --fail --silent --show-error --location \
            "https://awscli.amazonaws.com/AWSCLIV2-${AWS_CLI_VERSION}.pkg" \
            --output aws.pkg
          printf '%s  %s\n' "$AWS_CLI_SHA256" aws.pkg | shasum -a 256 --check
          sudo installer -pkg aws.pkg -target /
          installed_version=$(aws --version)
          case "$installed_version" in
            "aws-cli/${AWS_CLI_VERSION} "*) ;;
            *)
              echo "::error::Installed AWS CLI does not match ${AWS_CLI_VERSION}: $installed_version"
              exit 1
              ;;
          esac

      # Establish one immutable GitHub draft before touching either R2
      # namespace. A completed/public or conflicting tag therefore fails
      # without overwriting versioned downloads.
      - name: Upload and verify GitHub release assets
        if: github.ref_type == 'tag'
        id: github_release
        run: scripts/upload-github-mac-release-assets.sh

      - name: Upload to R2
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TARGET="mac/${APP_VERSION}"

          upload_versioned_object() {
            local source_path="$1"
            local name
            local expected_size
            local expected_sha256
            local remote_size
            local remote_sha256
            name=$(basename "$source_path")
            expected_size=$(stat -f '%z' "$source_path")
            expected_sha256=$(shasum -a 256 "$source_path" | awk '{print $1}')

            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "${TARGET}/${name}" \
              --body "$source_path" \
              --metadata "sha256=${expected_sha256}" \
              --cache-control "public, max-age=31536000, immutable" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null

            remote_size=$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "${TARGET}/${name}" \
              --query ContentLength --output text \
              --endpoint-url "$R2_ENDPOINT")
            remote_sha256=$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "${TARGET}/${name}" \
              --query 'Metadata.sha256' --output text \
              --endpoint-url "$R2_ENDPOINT")
            if [ "$remote_size" != "$expected_size" ] || \
               [ "$remote_sha256" != "$expected_sha256" ]; then
              echo "::error::Versioned R2 verification failed for $name"
              exit 1
            fi
          }

          VERSIONED_ASSETS=(
            "dist/Translator-${APP_VERSION}-darwin-arm64.dmg"
            "dist/Translator-${APP_VERSION}-darwin-arm64.dmg.blockmap"
            "dist/Translator-${APP_VERSION}-darwin-arm64.zip"
            "dist/Translator-${APP_VERSION}-darwin-arm64.zip.blockmap"
            "dist/Translator-${APP_VERSION}-darwin-x64.dmg"
            "dist/Translator-${APP_VERSION}-darwin-x64.dmg.blockmap"
            "dist/Translator-${APP_VERSION}-darwin-x64.zip"
            "dist/Translator-${APP_VERSION}-darwin-x64.zip.blockmap"
            "dist/latest-mac.yml"
          )
          for asset in "${VERSIONED_ASSETS[@]}"; do
            upload_versioned_object "$asset"
          done

      - name: Promote artefacts to latest/
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          mkdir -p latest
          # Keep the exact filenames referenced by latest-mac.yml. The updater
          # resolves them relative to /mac/latest/, so aliases alone are not enough.
          cp dist/latest-mac.yml latest/
          cp dist/*.blockmap latest/
          cp "dist/Translator-${APP_VERSION}-darwin-arm64.zip" latest/
          cp "dist/Translator-${APP_VERSION}-darwin-x64.zip" latest/
          cp "dist/Translator-${APP_VERSION}-darwin-arm64.dmg" latest/
          cp "dist/Translator-${APP_VERSION}-darwin-x64.dmg" latest/

          # Preserve the stable direct-download aliases used by the website.
          cp "dist/Translator-${APP_VERSION}-darwin-arm64.dmg" latest/Translator-arm64.dmg
          cp "dist/Translator-${APP_VERSION}-darwin-x64.dmg" latest/Translator-x64.dmg

          # Every payload is a single, authenticated PutObject with its local
          # SHA-256 persisted as R2 metadata. This avoids the multipart race
          # that previously returned InvalidPart while still appearing retryable.
          upload_latest_object() {
            local artifact="$1"
            local cache_control="$2"
            local source_path="latest/$artifact"
            local expected_size
            local expected_sha256
            local remote_size
            local remote_sha256
            expected_size=$(stat -f '%z' "$source_path")
            expected_sha256=$(shasum -a 256 "$source_path" | awk '{print $1}')

            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "mac/latest/$artifact" \
              --body "$source_path" \
              --metadata "sha256=${expected_sha256}" \
              --cache-control "$cache_control" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null

            remote_size=$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "mac/latest/$artifact" \
              --query ContentLength --output text \
              --endpoint-url "$R2_ENDPOINT")
            remote_sha256=$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "mac/latest/$artifact" \
              --query 'Metadata.sha256' --output text \
              --endpoint-url "$R2_ENDPOINT")
            if [ "$remote_size" != "$expected_size" ] || \
               [ "$remote_sha256" != "$expected_sha256" ]; then
              echo "::error::Latest R2 verification failed for $artifact"
              exit 1
            fi
          }

          IMMUTABLE_ARTIFACTS=(
            "Translator-${APP_VERSION}-darwin-arm64.zip.blockmap"
            "Translator-${APP_VERSION}-darwin-x64.zip.blockmap"
            "Translator-${APP_VERSION}-darwin-arm64.dmg.blockmap"
            "Translator-${APP_VERSION}-darwin-x64.dmg.blockmap"
            "Translator-${APP_VERSION}-darwin-arm64.zip"
            "Translator-${APP_VERSION}-darwin-x64.zip"
            "Translator-${APP_VERSION}-darwin-arm64.dmg"
            "Translator-${APP_VERSION}-darwin-x64.dmg"
          )
          for artifact in "${IMMUTABLE_ARTIFACTS[@]}"; do
            upload_latest_object "$artifact" \
              "public, max-age=31536000, immutable"
          done

          # Do not publish the new manifest until every referenced object is
          # independently reachable from the canonical public path.
          for artifact in \
            "Translator-${APP_VERSION}-darwin-arm64.zip" \
            "Translator-${APP_VERSION}-darwin-x64.zip" \
            "Translator-${APP_VERSION}-darwin-arm64.dmg" \
            "Translator-${APP_VERSION}-darwin-x64.dmg" \
            "Translator-${APP_VERSION}-darwin-arm64.zip.blockmap" \
            "Translator-${APP_VERSION}-darwin-x64.zip.blockmap" \
            "Translator-${APP_VERSION}-darwin-arm64.dmg.blockmap" \
            "Translator-${APP_VERSION}-darwin-x64.dmg.blockmap"; do
            expected_size=$(stat -f '%z' "latest/$artifact")
            remote_size=$(curl --fail --silent --show-error --location --head \
              "https://downloads.stage5.tools/mac/latest/$artifact?run=${GITHUB_RUN_ID}" | \
              sed -n 's/^[Cc]ontent-[Ll]ength:[[:space:]]*//p' | \
              tr -d '\r' | tail -n 1)
            if [ "$remote_size" != "$expected_size" ]; then
              echo "::error::Public R2 artifact size mismatch for $artifact (expected $expected_size, got ${remote_size:-missing})"
              exit 1
            fi
          done

          upload_latest_object "latest-mac.yml" \
            "no-cache, no-store, must-revalidate"

          public_manifest=$(mktemp)
          trap 'rm -f "$public_manifest"' EXIT
          curl --fail --silent --show-error \
            "https://downloads.stage5.tools/mac/latest/latest-mac.yml?run=${GITHUB_RUN_ID}" \
            --output "$public_manifest"
          if ! cmp -s latest/latest-mac.yml "$public_manifest"; then
            echo "::error::The public latest-mac.yml does not match the promoted release manifest."
            exit 1
          fi

          # Stable website aliases are independent final pointers. Updating
          # them after the verified updater manifest means any earlier failure
          # leaves both active channels on the previous release.
          for artifact in "Translator-arm64.dmg" "Translator-x64.dmg"; do
            upload_latest_object "$artifact" \
              "no-cache, no-store, must-revalidate"
            expected_size=$(stat -f '%z' "latest/$artifact")
            remote_size=$(curl --fail --silent --show-error --location --head \
              "https://downloads.stage5.tools/mac/latest/$artifact?run=${GITHUB_RUN_ID}" | \
              sed -n 's/^[Cc]ontent-[Ll]ength:[[:space:]]*//p' | \
              tr -d '\r' | tail -n 1)
            if [ "$remote_size" != "$expected_size" ]; then
              echo "::error::Public R2 alias size mismatch for $artifact (expected $expected_size, got ${remote_size:-missing})"
              exit 1
            fi
          done

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail

          TITLE=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          RELEASE_ID="${{ steps.github_release.outputs.release_id }}"
          PAYLOAD=$(mktemp)
          RESPONSE=$(mktemp)
          CANONICAL=$(mktemp)
          trap 'rm -f "$PAYLOAD" "$RESPONSE" "$CANONICAL"' EXIT

          jq -n \
            --arg name "$TITLE" \
            --rawfile body /tmp/release-notes.md \
            '{name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}' \
            > "$PAYLOAD"

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input "$PAYLOAD" > "$RESPONSE"

          if ! jq -e \
            --argjson id "$RELEASE_ID" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "$TITLE" \
            --rawfile body /tmp/release-notes.md \
            '.id == $id and .tag_name == $tag and .draft == false and
             .prerelease == false and .name == $name and .body == $body and
             .published_at != null' \
            "$RESPONSE" >/dev/null; then
            echo "::error::GitHub did not publish the verified draft release exactly as requested."
            exit 1
          fi

          # Re-hash the public release by exact ID after the state transition;
          # do not rely on the earlier draft verification remaining unchanged.
          scripts/upload-github-mac-release-assets.sh \
            --verify-only "$RELEASE_ID" false

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > "$CANONICAL"
          if [ "$(jq -r '.id' "$CANONICAL")" != "$RELEASE_ID" ] || \
             [ "$(jq -r '.draft' "$CANONICAL")" != "false" ]; then
            echo "::error::The canonical GitHub tag endpoint does not expose the verified release."
            exit 1
          fi
