name: Release – macOS (R2)

on:
  workflow_dispatch: # manual trigger for testing
  push:
    tags:
      - 'v*-mac' # Mac-only releases
      - 'v[0-9]+.[0-9]+.[0-9]+' # Full releases (both platforms) - pure SemVer only

permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-build:
    runs-on: macos-14 # Apple-silicon runner, Rosetta is available
    timeout-minutes: 60

    env:
      # ---------- Cloudflare R2 ----------
      R2_BUCKET: ai-translator-downloads
      R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # ---------- Apple codesign / notarise ----------
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ---------- GitHub ----------
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # ---------- youtube-dl-exec ----------
      YOUTUBE_DL_SKIP_DOWNLOAD: 'true'

    steps:
      # ————————————————————————————————————————————————————————————
      - uses: actions/checkout@v6

      # ---------- Node (no Bun) ----------
      - uses: actions/setup-node@v6
        with:
          node-version: '22' # updated to avoid warnings
          cache: 'npm'

      # ---------- Apple signing cert ----------
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      # ---------- Install deps & headless_shell (arm64) ----------
      - name: Install deps & headless_shell (arm64)
        run: |
          npm ci --no-audit --fund=false
          npx puppeteer@24.10.0 browsers install chrome-headless-shell \
            --platform mac_arm --path vendor/headless-arm64
          npx puppeteer@24.10.0 browsers install chrome-headless-shell \
            --platform mac     --path vendor/headless-x64

      - name: Validate release candidate
        run: |
          npm run lint
          npm test
          npm run security:dependencies

      # ---------- Rebuild native modules for both architectures ----------
      - name: Rebuild native modules for x64
        run: npm exec electron-builder install-app-deps -- --arch x64

      # ---------- Build both arm64 & x64 in one run ----------
      - name: Build both architectures
        run: npm run package:mac

      - name: Verify native payload architectures
        run: npm run verify:architectures

      - name: Verify signed apps and updater archives
        run: |
          set -euo pipefail

          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          VERIFY_ROOT=$(mktemp -d)
          trap 'rm -rf "$VERIFY_ROOT"' EXIT

          verify_app() {
            local app_path="$1"
            echo "Verifying signed app: $app_path"
            codesign --verify --deep --strict --verbose=4 "$app_path"
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
          }

          verify_zip() {
            local arch="$1"
            local zip_path="dist/Translator-${APP_VERSION}-darwin-${arch}.zip"
            local extract_dir="$VERIFY_ROOT/$arch"

            if [ ! -f "$zip_path" ]; then
              echo "::error::Missing updater archive: $zip_path"
              exit 1
            fi

            mkdir -p "$extract_dir"
            ditto -x -k "$zip_path" "$extract_dir"
            verify_app "$extract_dir/Translator.app"
          }

          verify_app "dist/mac/Translator.app"
          verify_app "dist/mac-arm64/Translator.app"
          verify_zip x64
          verify_zip arm64

      - name: Extract tag annotation
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_notes
        run: |
          # Ensure the full annotated tag object is available
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          TAG_TYPE=$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must be an annotated tag."
            exit 1
          fi

          # Extract the body (text after the subject line + blank line).
          BODY=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::Tag $GITHUB_REF_NAME annotation body is empty."
            echo "::error::Add release notes after a blank line in the tag annotation."
            exit 1
          fi

          printf '%s\n' "$BODY" > /tmp/release-notes.md

      - name: Inject release notes into latest-mac.yml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          node scripts/inject-update-release-notes.mjs \
            --yaml dist/latest-mac.yml \
            --version "$APP_VERSION" \
            --release-notes-file /tmp/release-notes.md

      # —————————————————————————————————— upload & release ——————————————————————————
      - name: Install AWS CLI v2
        run: |
          curl -sSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o aws.pkg
          sudo installer -pkg aws.pkg -target /
          aws --version

      - name: Upload to R2
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="mac/${VERSION:-latest}"
          aws s3 cp dist/ "s3://${R2_BUCKET}/${TARGET}/" \
            --recursive --exclude "*" --include "*.dmg" --include "*.zip" \
            --include "*mac.yml" --include "*.blockmap" \
            --endpoint-url "${R2_ENDPOINT}"

      - name: Promote artefacts to latest/
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          mkdir -p latest
          # Keep the exact filenames referenced by latest-mac.yml. The updater
          # resolves them relative to /mac/latest/, so aliases alone are not enough.
          cp dist/latest-mac.yml latest/
          cp dist/*.blockmap latest/
          cp "dist/Translator-${APP_VERSION}-darwin-arm64.zip" latest/
          cp "dist/Translator-${APP_VERSION}-darwin-x64.zip" latest/
          cp "dist/Translator-${APP_VERSION}-darwin-arm64.dmg" latest/
          cp "dist/Translator-${APP_VERSION}-darwin-x64.dmg" latest/

          # Preserve the stable direct-download aliases used by the website.
          cp "dist/Translator-${APP_VERSION}-darwin-arm64.dmg" latest/Translator-arm64.dmg
          cp "dist/Translator-${APP_VERSION}-darwin-x64.dmg" latest/Translator-x64.dmg

          # Upload small metadata files first
          aws s3 cp latest/ "s3://${R2_BUCKET}/mac/latest/" \
            --recursive --exclude "*" --include "*.yml" --include "*.blockmap" \
            --endpoint-url "${R2_ENDPOINT}"

          # Upload updater ZIPs, versioned DMGs, and stable DMG aliases
          # individually to avoid R2 InvalidPart issues.
          LARGE_ARTIFACTS=(
            "Translator-${APP_VERSION}-darwin-arm64.zip"
            "Translator-${APP_VERSION}-darwin-x64.zip"
            "Translator-${APP_VERSION}-darwin-arm64.dmg"
            "Translator-${APP_VERSION}-darwin-x64.dmg"
            "Translator-arm64.dmg"
            "Translator-x64.dmg"
          )
          for artifact in "${LARGE_ARTIFACTS[@]}"; do
            echo "Uploading $artifact (single PUT)"
            aws s3 cp "latest/$artifact" "s3://${R2_BUCKET}/mac/latest/$artifact" \
              --no-progress --no-multipart --endpoint-url "${R2_ENDPOINT}" || {
              echo "Multipart fallback for $artifact (reduced concurrency)"
              AWS_MAX_CONCURRENCY=2 AWS_S3_MULTI_PART_CHUNK_SIZE=64MB \
                aws s3 cp "latest/$artifact" "s3://${R2_BUCKET}/mac/latest/$artifact" \
                --no-progress --endpoint-url "${R2_ENDPOINT}"
            }
          done

          # Fail the release if the public feed references an object that the
          # canonical latest path cannot serve.
          for artifact in \
            "Translator-${APP_VERSION}-darwin-arm64.zip" \
            "Translator-${APP_VERSION}-darwin-x64.zip" \
            "Translator-${APP_VERSION}-darwin-arm64.dmg" \
            "Translator-${APP_VERSION}-darwin-x64.dmg"; do
            curl --fail --silent --show-error --head \
              "https://downloads.stage5.tools/mac/latest/$artifact" >/dev/null
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TITLE=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md

      - name: Upload and verify GitHub auto-updater assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          ASSETS=(
            "dist/Translator-${APP_VERSION}-darwin-arm64.zip"
            "dist/Translator-${APP_VERSION}-darwin-arm64.zip.blockmap"
            "dist/Translator-${APP_VERSION}-darwin-x64.zip"
            "dist/Translator-${APP_VERSION}-darwin-x64.zip.blockmap"
            "dist/latest-mac.yml"
          )

          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Required auto-updater asset is missing: $asset"
              exit 1
            fi
          done

          # electron-builder can finish successfully even when a large GitHub
          # release upload is incomplete. Upload the updater payloads explicitly.
          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > /tmp/github-release.json

          for asset in "${ASSETS[@]}"; do
            name=$(basename "$asset")
            expected_size=$(stat -f '%z' "$asset")
            uploaded_size=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .size' \
              /tmp/github-release.json)

            if [ -z "$uploaded_size" ] || [ "$uploaded_size" = "null" ]; then
              echo "::error::GitHub release asset is missing after upload: $name"
              exit 1
            fi

            if [ "$uploaded_size" != "$expected_size" ]; then
              echo "::error::GitHub release asset size mismatch for $name (expected $expected_size, got $uploaded_size)"
              exit 1
            fi

            echo "Verified $name ($uploaded_size bytes)"
          done
