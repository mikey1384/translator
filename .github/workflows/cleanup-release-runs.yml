name: Clean completed release runs

on:
  workflow_run:
    workflows: [Release – macOS (R2)]
    types: [completed]
  workflow_dispatch:

# Serialize with the release transaction, and do not displace queued releases.
concurrency:
  group: mac-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    if: github.repository == 'mikey1384/translator' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Verify cleanup guards
        run: node --test scripts/tests/cleanup-release-runs.test.mjs
      - name: Remove finished release runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-release-runs.mjs
